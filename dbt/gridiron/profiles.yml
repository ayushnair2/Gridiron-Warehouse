gridiron:
  target: dev
  outputs:
    dev:
      type: snowflake
      # no defaults: these are environment- and secret-specific, so an unset var
      # must fail loudly rather than silently connect somewhere unintended
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'NFL_ENGINEER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'NFL_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'NFL_ANALYTICS') }}"
      # DBT_SCHEMA, not SNOWFLAKE_SCHEMA: the latter is the ingest destination (RAW),
      # while dbt builds its models into a separate schema (ANALYTICS)
      schema: "{{ env_var('DBT_SCHEMA', 'ANALYTICS') }}"
      threads: 4
